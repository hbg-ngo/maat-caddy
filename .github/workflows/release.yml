name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Smoke-test every platform before anything is pushed:
      # non-root user, Node version matches .nvmrc, native SQLite module loads.
      - name: Build and smoke-test (amd64, arm64)
        run: |
          for platform in linux/amd64 linux/arm64; do
            tag="maat-caddy:smoke-${platform#linux/}"
            docker buildx build --platform "$platform" --load --cache-to type=gha,mode=max,scope="$platform" --cache-from type=gha,scope="$platform" -t "$tag" .
            run() { docker run --rm --platform "$platform" --entrypoint node "$tag" "$@"; }
            test "$(run -p 'process.getuid()')" = "10001"
            test "$(run --version)" = "v$(cat .nvmrc)"
            run -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get()"
          done
      - run: APP_VERSION="$GITHUB_REF_NAME" CADDY_GID=0 docker compose config --quiet

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=maat-caddy
            org.opencontainers.image.description=Matomo AI Assistant Tracker for Caddy access logs
            org.opencontainers.image.licenses=MIT
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
      # Signed GitHub attestation; verify with
      # gh attestation verify oci://ghcr.io/hbg-ngo/maat-caddy:<tag> --owner hbg-ngo
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
