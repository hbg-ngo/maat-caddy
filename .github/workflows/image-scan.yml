name: Image scan

# Rescans the published image daily so newly disclosed CVEs show up in the
# Security tab even when nothing in the repository changed.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: ghcr.io/${{ github.repository }}:latest
          # Fail on fixable high/critical CVEs so the run turns red (and notifies)
          # as soon as the published image needs a rebuild; PR CI would block on
          # the same findings.
          severity-cutoff: high
          # Only report CVEs with a released fix, so every alert is actionable
          # (rebuild / bump the base image digest).
          only-fixed: true
          output-format: sarif
          cache-db: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-latest
